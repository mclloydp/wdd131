    <h1>Temples of The Church of Jesus Christ of Latter-day Saints</h1>

    <div class="temple-grid">
      <figure class="temple-card">
        <img src="/image/salt_lake_temple_renovation_rendering.jpeg" alt="Salt Lake Temple exterior with granite towers under renovation scaffolding set against cloudy sky" loading="lazy" width="800" height="450" />
        <figcaption>Salt Lake Temple <span>&middot; 1893</span></figcaption>
      </figure>

      <figure class="temple-card">
        <img src="/image/harare_zimbabwe_temple_exterior_rendering.jpeg" alt="Harare Zimbabwe Temple rendering showing white temple with tall spires and manicured grounds" loading="lazy" width="800" height="450" />
        <figcaption>Harare Zimbabwe Temple <span>&middot; 2026</span></figcaption>
      </figure>

      <figure class="temple-card">
        <img src="/image/johannesburg_south_africa_temple_lds.jpeg" alt="Johannesburg South Africa Temple exterior with illuminated spires and well tended lawn in evening light" loading="lazy" width="800" height="450" />
        <figcaption>Johannesburg South Africa Temple <span>&middot; 1985</span></figcaption>
      </figure>

      <figure class="temple-card">
        <img src="/image/aba_nigeria_temple_lds.jpeg" alt="Aba Nigeria Temple exterior with pale stone walls and tropical landscaping in bright daylight" loading="lazy" width="800" height="450" />
        <figcaption>Aba Nigeria Temple <span>&middot; 2005</span></figcaption>
      </figure>

      <figure class="temple-card">
        <img src="/image/accra_ghana_temple_lds.jpeg" alt="Accra Ghana Temple exterior with tall steeple and palm trees on a sunny campus" loading="lazy" width="800" height="450" />
        <figcaption>Accra Ghana Temple <span>&middot; 2004</span></figcaption>
      </figure>

      <figure class="temple-card">
        <img src="/image/nairobi_kenya_temple_exterior.jpeg" alt="Nairobi Kenya Temple exterior surrounded by green shrubs and open sky at a temple campus" loading="lazy" width="800" height="450" />
        <figcaption>Nairobi Kenya Temple <span>&middot; 2025</span></figcaption>
      </figure>

      <figure class="temple-card">
        <img src="/image/kinshasa_temple.jpeg" alt="Kinshasa Democratic Republic of the Congo Temple exterior with central spire and nearby urban vegetation" loading="lazy" width="800" height="450" />
        <figcaption>Kinshasa DR Congo Temple <span>&middot; 2019</span></figcaption>
      </figure>

      <figure class="temple-card">
        <img src="/image/temple_rendering_lagos_nigeria_temple.jpeg" alt="Lagos Nigeria Temple rendering of white temple with multiple spires and construction style setting" loading="lazy" width="800" height="450" />
